<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Calgary City Logo Design -->
  <defs>
    <linearGradient id="calgaryRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E55347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D52B1E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="url(#calgaryRed)" stroke="#B22317" stroke-width="2"/>
  
  <!-- City skyline silhouette -->
  <g fill="#FFFFFF">
    <!-- Calgary Tower (iconic landmark) -->
    <rect x="55" y="25" width="4" height="35" rx="1"/>
    <circle cx="57" cy="22" r="3"/>
    <rect x="56" y="20" width="2" height="4"/>
    
    <!-- Building blocks representing downtown -->
    <rect x="25" y="45" width="8" height="25" rx="1"/>
    <rect x="35" y="40" width="6" height="30" rx="1"/>
    <rect x="43" y="48" width="5" height="22" rx="1"/>
    <rect x="65" y="42" width="7" height="28" rx="1"/>
    <rect x="74" y="50" width="5" height="20" rx="1"/>
    <rect x="81" y="38" width="9" height="32" rx="1"/>
    <rect x="92" y="46" width="6" height="24" rx="1"/>
    
    <!-- Mountain silhouette (Rocky Mountains) -->
    <polygon points="10,70 20,50 30,60 45,35 60,55 75,30 90,50 110,65 110,75 10,75" opacity="0.8"/>
  </g>
  
  <!-- Text elements -->
  <text x="60" y="88" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10" font-weight="bold">CITY OF</text>
  <text x="60" y="100" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="12" font-weight="bold">CALGARY</text>
</svg>
